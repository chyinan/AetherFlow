# Production TLS configuration. Mount this file and the certificate/key through docker-compose.tls.yml.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=5s ipv6=off;
    limit_req_zone $binary_remote_addr zone=aetherflow_api:10m rate=20r/s;

    server {
        listen 8080;
        server_name _;
        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen 8443 ssl http2;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /api/ {
            limit_req zone=aetherflow_api burst=40 nodelay;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://gateway-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        location /ws/ {
            rewrite ^/ws/?(.*)$ /$1 break;
            proxy_pass http://gateway-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location /sse/ {
            rewrite ^/sse/?(.*)$ /$1 break;
            proxy_pass http://gateway-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }
        location ~* ^/assets/.*\.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
