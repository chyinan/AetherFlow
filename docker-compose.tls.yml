name: aetherflow

services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_HTTPS_PORT:-443}:8443"
    volumes:
      - "${NGINX_TLS_DIR:?Set NGINX_TLS_DIR to a directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro"
      - "./frontend/nginx/nginx.tls.conf:/etc/nginx/nginx.conf:ro"
