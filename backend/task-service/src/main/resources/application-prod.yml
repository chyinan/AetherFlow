spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aetherflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:aetherflow_app}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${TASK_DB_POOL_MAX:30}
      minimum-idle: ${TASK_DB_POOL_MIN:8}
      connection-timeout: ${TASK_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${TASK_DB_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${TASK_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${TASK_DB_MAX_LIFETIME_MS:1800000}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_SSL_PORT:5671}
    username: ${RABBITMQ_USERNAME:aetherflow}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: aetherflow_tx_group
  service:
    vgroup-mapping:
      aetherflow_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:seata:8091}

aetherflow:
  task:
    queue-protection:
      management-api:
        base-url: ${RABBITMQ_MANAGEMENT_URL:http://rabbitmq:15672}
        username: ${RABBITMQ_USERNAME:aetherflow}
        password: ${RABBITMQ_PASSWORD}
