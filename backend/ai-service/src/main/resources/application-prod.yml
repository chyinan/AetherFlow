spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aetherflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:aetherflow_app}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_SSL_PORT:5671}
    username: ${RABBITMQ_USERNAME:aetherflow}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: true
    listener:
      simple:
        default-requeue-rejected: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}

aetherflow:
  file:
    internal-token: ${FILE_INTERNAL_TOKEN}
  task:
    internal-token: ${TASK_INTERNAL_TOKEN}
  python-ai:
    base-url: ${PYTHON_AI_BASE_URL:http://python-ai-service:8200}
    api-key: ${AI_SERVICE_API_KEY}
    status-timeout-millis: ${PYTHON_AI_STATUS_TIMEOUT_MILLIS:3000}
  ai:
    internal-token: ${AI_INTERNAL_TOKEN}
    image:
      default-timeout: ${AI_IMAGE_DEFAULT_TIMEOUT:5m}
      health-timeout: ${AI_IMAGE_HEALTH_TIMEOUT:2s}
      health-cache-ttl: ${AI_IMAGE_HEALTH_CACHE_TTL:10s}
      stable-diffusion:
        enabled: ${SD_WEBUI_ENABLED:false}
        base-url: ${SD_WEBUI_BASE_URL:http://host.docker.internal:7860}
      comfy:
        enabled: ${COMFYUI_ENABLED:false}
        base-url: ${COMFYUI_BASE_URL:http://host.docker.internal:8188}
        poll-interval: ${COMFYUI_POLL_INTERVAL:1s}
        max-wait: ${COMFYUI_MAX_WAIT:10m}
    default-provider: ${AI_DEFAULT_PROVIDER:OLLAMA}
    default-model: ${AI_DEFAULT_MODEL:qwen3:8b}
    provider-priority:
      - ${AI_PROVIDER_PRIMARY:OLLAMA}
      - ${AI_PROVIDER_SECONDARY:OPENAI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
