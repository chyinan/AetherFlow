spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aetherflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USERNAME:aetherflow}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}

aetherflow:
  ai:
    internal-token: ${AI_INTERNAL_TOKEN}
  file:
    internal-token: ${FILE_INTERNAL_TOKEN}
  task:
    internal-token: ${TASK_INTERNAL_TOKEN}
  python-ai:
    base-url: ${PYTHON_AI_BASE_URL:http://python-ai-service:8200}
    api-key: ${AI_SERVICE_API_KEY}
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:OLLAMA}
    default-model: ${AI_DEFAULT_MODEL:qwen3:8b}
    provider-priority:
      - ${AI_PROVIDER_PRIMARY:OLLAMA}
      - ${AI_PROVIDER_SECONDARY:OPENAI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
