server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  config:
    import: optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.101.68:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:192.168.101.68:8848}
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.101.68:8858}
      eager: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: workflow-service
          uri: lb://workflow-service
          predicates:
            - Path=/workflows/**,/workflow-instances/**
        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/tasks/**,/internal/tasks/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/files/**,/internal/files/**
        - id: notify-service
          uri: lb://notify-service
          predicates:
            - Path=/notify/**

aetherflow:
  security:
    jwt:
      issuer: aetherflow
      secret: ${JWT_SECRET:aetherflow-dev-secret-key-change-me-32bytes-minimum}
      expire-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: workflow-service
        url: /workflows/v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

