spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aetherflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:aetherflow_app}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_SSL_PORT:5671}
    username: ${RABBITMQ_USERNAME:aetherflow}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: true
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${WORKFLOW_FEIGN_CONNECT_TIMEOUT_MILLIS:5000}
            readTimeout: ${WORKFLOW_FEIGN_READ_TIMEOUT_MILLIS:1800000}

seata:
  service:
    grouplist:
      default: ${SEATA_ADDR:seata:8091}

aetherflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  file:
    internal-token: ${FILE_INTERNAL_TOKEN}
  task:
    internal-token: ${TASK_INTERNAL_TOKEN}
  ai:
    internal-token: ${AI_INTERNAL_TOKEN}
  notify:
    internal-token: ${NOTIFY_INTERNAL_TOKEN}
  workflow:
    websocket:
      allowed-origins: ${AETHERFLOW_WORKFLOW_ALLOWED_ORIGINS:http://localhost}
    node:
      file-internal-token: ${FILE_INTERNAL_TOKEN}
      async-ai-enabled: ${WORKFLOW_AI_ASYNC_ENABLED:true}
    embedding:
      ollama-base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    ocr:
      mock: ${WORKFLOW_OCR_MOCK:false}
      default-provider: ${WORKFLOW_OCR_PROVIDER:auto}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
