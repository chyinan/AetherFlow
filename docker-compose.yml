name: aetherflow

x-java-service-deploy: &java-service-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
  resources:
    limits:
      cpus: "2.0"
      memory: 1G
      pids: 512
    reservations:
      cpus: "0.25"
      memory: 256M

x-python-ai-deploy: &python-ai-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
  resources:
    limits:
      cpus: "4.0"
      memory: 4G
      pids: 1024
    reservations:
      cpus: "0.5"
      memory: 512M

services:
  mysql:
    image: mysql:8.0.26
    container_name: aetherflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MYSQL_USER: ${MYSQL_USERNAME:-aetherflow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aetherflow}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - aetherflow

  redis:
    image: redis:7.2
    container_name: aetherflow-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - aetherflow

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: aetherflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-aetherflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - aetherflow

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: aetherflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - aetherflow

  nacos:
    image: nacos/nacos-server:v2.4.0.1
    container_name: aetherflow-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: ${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:-18000}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
      - aetherflow

  seata:
    image: seataio/seata-server:1.5.2
    container_name: aetherflow-seata
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
      STORE_MODE: db
      NACOS_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - aetherflow

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: aetherflow-sentinel-dashboard
    ports:
      - "127.0.0.1:8858:8858"
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=127.0.0.1:8858 -Dproject.name=sentinel-dashboard"
    restart: unless-stopped
    networks:
      - aetherflow

  elasticsearch:
    image: elasticsearch:7.17.7
    container_name: aetherflow-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - aetherflow

  kibana:
    image: kibana:7.17.7
    container_name: aetherflow-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aetherflow

  python-ai-service:
    build:
      context: .
      dockerfile: python-ai-service/Dockerfile
    container_name: aetherflow-python-ai-service
    deploy: *python-ai-deploy
    environment:
      ENABLE_WHISPER: ${ENABLE_WHISPER:-false}
      ENABLE_LLM: ${ENABLE_LLM:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_MAX_CONCURRENCY: ${WHISPER_MAX_CONCURRENCY:-2}
      FFMPEG_MAX_CONCURRENCY: ${FFMPEG_MAX_CONCURRENCY:-2}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      ENABLE_CODE_RUNTIME_ENDPOINT: "false"
      FILE_URL_REWRITE_FROM: ${FILE_URL_REWRITE_FROM:-http://localhost:9000}
      FILE_URL_REWRITE_TO: ${FILE_URL_REWRITE_TO:-http://minio:9000}
      OTEL_SERVICE_NAME: python-ai-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aetherflow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - aetherflow

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aetherflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - aetherflow

  # 任意代码不在通用 AI 容器中执行；该服务只能通过私有运行时网络由工作流服务访问。
  code-runtime-service:
    build:
      context: .
      dockerfile: python-ai-service/CodeRuntime.Dockerfile
    container_name: aetherflow-code-runtime-service
    environment:
      APP_ENV: prod
      ENABLE_CODE_RUNTIME_ENDPOINT: "true"
      CODE_RUNTIME_API_KEY: ${CODE_RUNTIME_API_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      CODE_RUNTIME_MAX_CONCURRENCY: ${CODE_RUNTIME_MAX_CONCURRENCY:-2}
      CODE_RUNTIME_MAX_REQUEST_BYTES: ${CODE_RUNTIME_MAX_REQUEST_BYTES:-1048576}
    expose:
      - "8300"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - aetherflow-code-runtime

  nacos-init:
    image: curlimages/curl:8.10.1
    container_name: aetherflow-nacos-init
    environment:
      NACOS_ADDR: http://nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NACOS_INIT_DEFAULT_PASSWORD: ${NACOS_INIT_DEFAULT_PASSWORD:-nacos}
    command:
      - sh
      - -ec
      - |
        extract_token() {
          printf '%s' "$1" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p'
        }
        login() {
          curl -fsS -X POST "$${NACOS_ADDR}/nacos/v1/auth/login" \
            --data-urlencode "username=$${NACOS_USERNAME}" \
            --data-urlencode "password=$$1"
        }
        current_response="$$(login "$${NACOS_PASSWORD}" 2>/dev/null || true)"
        current_token="$$(extract_token "$${current_response}")"
        if [ -n "$${current_token}" ]; then
          echo 'Nacos admin password already initialized.'
          exit 0
        fi
        initial_response="$$(login "$${NACOS_INIT_DEFAULT_PASSWORD}" 2>/dev/null || true)"
        initial_token="$$(extract_token "$${initial_response}")"
        if [ -z "$${initial_token}" ]; then
          echo 'Unable to authenticate to Nacos with either configured or initial credentials.' >&2
          exit 1
        fi
        curl -fsS -X PUT "$${NACOS_ADDR}/nacos/v1/auth/users?accessToken=$${initial_token}" \
          --data-urlencode "username=$${NACOS_USERNAME}" \
          --data-urlencode "newPassword=$${NACOS_PASSWORD}"
        echo 'Nacos admin password initialized.'
    depends_on:
      nacos:
        condition: service_healthy
    restart: "no"
    networks:
      - aetherflow

  mysql-migrate:
    image: flyway/flyway:10.20.1
    container_name: aetherflow-mysql-migrate
    command:
      - -connectRetries=60
      - -baselineOnMigrate=true
      - -baselineVersion=0
      - migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aetherflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./docker/mysql/migrations:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - aetherflow

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: aetherflow-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped
    networks:
      - aetherflow

  frontend:
    build:
      context: ./frontend
      dockerfile: nginx/Dockerfile
      target: frontend-dist
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_WS_BASE: ${VITE_WS_BASE:-/ws}
        VITE_SSE_BASE: ${VITE_SSE_BASE:-/sse}
        VITE_MOCK_FALLBACK: ${VITE_MOCK_FALLBACK:-false}
        VITE_NOTIFY_WS_FALLBACK: ${VITE_NOTIFY_WS_FALLBACK:-true}
        VITE_RUNTIME_WS_FALLBACK: ${VITE_RUNTIME_WS_FALLBACK:-true}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
    container_name: aetherflow-frontend
    volumes:
      - frontend-dist:/output
    restart: "no"
    networks:
      - aetherflow

  nginx:
    build:
      context: ./frontend
      dockerfile: nginx/Dockerfile
      target: nginx-runtime
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_WS_BASE: ${VITE_WS_BASE:-/ws}
        VITE_SSE_BASE: ${VITE_SSE_BASE:-/sse}
        VITE_MOCK_FALLBACK: ${VITE_MOCK_FALLBACK:-false}
        VITE_NOTIFY_WS_FALLBACK: ${VITE_NOTIFY_WS_FALLBACK:-true}
        VITE_RUNTIME_WS_FALLBACK: ${VITE_RUNTIME_WS_FALLBACK:-true}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
    container_name: aetherflow-nginx
    deploy: *java-service-deploy
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
    depends_on:
      gateway-service:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aetherflow

  gateway-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: gateway-service
    deploy: *java-service-deploy
    environment:
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NACOS_USERNAME: ${NACOS_USERNAME:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_RABBITMQ_TEMPLATE_OBSERVATION_ENABLED: "true"
      SPRING_RABBITMQ_LISTENER_SIMPLE_OBSERVATION_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      workflow-service:
        condition: service_started
      task-service:
        condition: service_started
      ai-service:
        condition: service_started
      file-service:
        condition: service_started
      notify-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - aetherflow

  auth-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: auth-service
    deploy: *java-service-deploy
    environment: &java-service-env
      SPRING_PROFILES_ACTIVE: prod
      NACOS_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aetherflow}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-aetherflow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-aetherflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      PYTHON_AI_BASE_URL: ${PYTHON_AI_BASE_URL:-http://python-ai-service:8200}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WORKFLOW_OCR_MOCK: ${WORKFLOW_OCR_MOCK:-false}
      WORKFLOW_OCR_PROVIDER: ${WORKFLOW_OCR_PROVIDER:-auto}
      WORKFLOW_DOCUMENT_MAX_FILE_BYTES: ${WORKFLOW_DOCUMENT_MAX_FILE_BYTES:-26214400}
      WORKFLOW_DOCUMENT_MAX_EXTRACTED_CHARACTERS: ${WORKFLOW_DOCUMENT_MAX_EXTRACTED_CHARACTERS:-1000000}
      AETHERFLOW_WORKFLOW_ALLOWED_ORIGINS: ${AETHERFLOW_WORKFLOW_ALLOWED_ORIGINS:-http://localhost}
      WORKFLOW_RUNTIME_WS_STREAM_TIMEOUT: ${WORKFLOW_RUNTIME_WS_STREAM_TIMEOUT:-5m}
      WORKFLOW_RUNTIME_WS_POLL_INTERVAL: ${WORKFLOW_RUNTIME_WS_POLL_INTERVAL:-1s}
      WORKFLOW_RUNTIME_WS_HEARTBEAT_INTERVAL: ${WORKFLOW_RUNTIME_WS_HEARTBEAT_INTERVAL:-15s}
      WORKFLOW_RUNTIME_WS_THREAD_POOL_SIZE: ${WORKFLOW_RUNTIME_WS_THREAD_POOL_SIZE:-8}
      WORKFLOW_RUNTIME_WS_MAX_CONNECTIONS: ${WORKFLOW_RUNTIME_WS_MAX_CONNECTIONS:-2000}
      WORKFLOW_OCR_MOCK_TEXT: ${WORKFLOW_OCR_MOCK_TEXT:-}
      SEATA_ADDR: seata:8091
      JWT_SECRET: ${JWT_SECRET:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-}
      GITHUB_OAUTH_SUCCESS_PATH: ${GITHUB_OAUTH_SUCCESS_PATH:-/auth/oauth/callback}
      GITHUB_OAUTH_FAILURE_PATH: ${GITHUB_OAUTH_FAILURE_PATH:-/login}
      GITHUB_OAUTH_STATE_SECRET: ${GITHUB_OAUTH_STATE_SECRET:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      FILE_INTERNAL_TOKEN: ${FILE_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      TASK_INTERNAL_TOKEN: ${TASK_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_RABBITMQ_TEMPLATE_OBSERVATION_ENABLED: "true"
      SPRING_RABBITMQ_LISTENER_SIMPLE_OBSERVATION_ENABLED: "true"
    expose:
      - "8101"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - aetherflow

  workflow-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: workflow-service
    deploy: *java-service-deploy
    environment:
      <<: *java-service-env
      WORKFLOW_AI_ASYNC_ENABLED: ${WORKFLOW_AI_ASYNC_ENABLED:-true}
      WORKFLOW_CODE_EXECUTION_ENABLED: ${WORKFLOW_CODE_EXECUTION_ENABLED:-false}
      WORKFLOW_CODE_RUNTIME_ISOLATION_CONFIRMED: ${WORKFLOW_CODE_RUNTIME_ISOLATION_CONFIRMED:-false}
      WORKFLOW_CODE_RUNTIME_URL: ${WORKFLOW_CODE_RUNTIME_URL:-http://code-runtime-service:8300}
      WORKFLOW_CODE_RUNTIME_API_KEY: ${WORKFLOW_CODE_RUNTIME_API_KEY:-}
      WORKFLOW_EMBEDDING_VECTOR_STORE_PROVIDER: ${WORKFLOW_EMBEDDING_VECTOR_STORE_PROVIDER:-qdrant}
      WORKFLOW_EMBEDDING_IN_MEMORY_ENABLED: ${WORKFLOW_EMBEDDING_IN_MEMORY_ENABLED:-false}
      WORKFLOW_KNOWLEDGE_VECTOR_INDEX_REQUIRED: ${WORKFLOW_KNOWLEDGE_VECTOR_INDEX_REQUIRED:-false}
      WORKFLOW_QDRANT_BASE_URL: ${WORKFLOW_QDRANT_BASE_URL:-https://qdrant.example.com}
      WORKFLOW_QDRANT_API_KEY: ${WORKFLOW_QDRANT_API_KEY:-}
      WORKFLOW_QDRANT_ENABLED: ${WORKFLOW_QDRANT_ENABLED:-false}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
    expose:
      - "8102"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      mysql-migrate:
        condition: service_completed_successfully
      seata:
        condition: service_started
      task-service:
        condition: service_started
      code-runtime-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aetherflow
      - aetherflow-code-runtime

  task-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: task-service
    deploy: *java-service-deploy
    environment:
      <<: *java-service-env
      XXL_JOB_ENABLED: "false"
    expose:
      - "8103"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      seata:
        condition: service_started
    restart: unless-stopped
    networks:
      - aetherflow

  ai-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: ai-service
    deploy: *java-service-deploy
    environment:
      <<: *java-service-env
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
      PYTHON_AI_STATUS_TIMEOUT_MILLIS: ${PYTHON_AI_STATUS_TIMEOUT_MILLIS:-3000}
      AI_JOB_LEASE_DURATION: ${AI_JOB_LEASE_DURATION:-2m}
      AI_JOB_LEASE_HEARTBEAT_INTERVAL: ${AI_JOB_LEASE_HEARTBEAT_INTERVAL:-30s}
      AI_IMAGE_DEFAULT_TIMEOUT: ${AI_IMAGE_DEFAULT_TIMEOUT:-5m}
      AI_IMAGE_HEALTH_TIMEOUT: ${AI_IMAGE_HEALTH_TIMEOUT:-2s}
      AI_IMAGE_HEALTH_CACHE_TTL: ${AI_IMAGE_HEALTH_CACHE_TTL:-10s}
      SD_WEBUI_ENABLED: ${SD_WEBUI_ENABLED:-false}
      SD_WEBUI_BASE_URL: ${SD_WEBUI_BASE_URL:-http://host.docker.internal:7860}
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-false}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_POLL_INTERVAL: ${COMFYUI_POLL_INTERVAL:-1s}
      COMFYUI_MAX_WAIT: ${COMFYUI_MAX_WAIT:-10m}
    expose:
      - "8104"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      python-ai-service:
        condition: service_healthy
      file-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - aetherflow

  file-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: file-service
    deploy: *java-service-deploy
    environment:
      <<: *java-service-env
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
    expose:
      - "8105"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      seata:
        condition: service_started
    restart: unless-stopped
    networks:
      - aetherflow

  notify-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: notify-service
    deploy: *java-service-deploy
    environment:
      <<: *java-service-env
      NOTIFY_REDIS_FANOUT_ENABLED: ${NOTIFY_REDIS_FANOUT_ENABLED:-true}
      NOTIFY_MAX_SSE_CONNECTIONS: ${NOTIFY_MAX_SSE_CONNECTIONS:-10000}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:?Run scripts/aetherflow-init-env.ps1 before starting AetherFlow}
    expose:
      - "8106"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - aetherflow

networks:
  aetherflow:
    name: aetherflow-network
    driver: bridge
  aetherflow-code-runtime:
    name: aetherflow-code-runtime-network
    driver: bridge
    internal: true

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  frontend-dist:
  elasticsearch-data:
  prometheus-data:
  grafana-data:

