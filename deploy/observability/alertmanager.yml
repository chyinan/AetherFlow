global:
  resolve_timeout: 5m

route:
  receiver: aetherflow-operations
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: aetherflow-operations
    # The compose entrypoint substitutes this URL from ALERTMANAGER_WEBHOOK_URL.
    # In production the process exits if it is missing, so alerts cannot be
    # silently accepted by an empty receiver.
    webhook_configs:
      - url: "__ALERTMANAGER_WEBHOOK_URL__"
