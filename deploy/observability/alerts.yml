groups:
  - name: aetherflow-production
    rules:
      - alert: AetherFlowHighHttp5xxRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "AetherFlow HTTP 5xx rate is above 5%"
      - alert: AetherFlowDatabasePoolExhaustion
        expr: |
          max by (job, instance) (hikaricp_connections_active)
          /
          max by (job, instance) (hikaricp_connections_max) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AetherFlow database pool is above 90% utilization"
      - alert: AetherFlowServiceDown
        expr: up{job=~"aetherflow-gateway|aetherflow-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AetherFlow service scrape target is down"
      - alert: AetherFlowQueueHealthUnknown
        expr: aetherflow_task_queue_health_known == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AetherFlow queue health metrics are unavailable; admission is fail-closed"
      - alert: AetherFlowQueueBackpressure
        expr: aetherflow_task_queue_busy == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AetherFlow task queue admission is under backpressure"
